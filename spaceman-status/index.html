<!doctype html>
<html lang="zh-CN">
<head>
<script>document.write('<base href="' + (location.hostname.endsWith('.github.io') ? '/Satellite-Anomaly-Detection-System/' : '/') + '">');</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPACEMAN Status</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #05070a;
      color: #e5e7eb;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #05070a;
    }

    .topbar {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      border-bottom: 1px solid rgba(255, 255, 255, .10);
      background: rgba(5, 7, 10, .94);
    }

    .brand {
      color: #f9fafb;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: .04em;
    }

    .back {
      color: rgba(229, 231, 235, .72);
      text-decoration: none;
      font-size: 13px;
    }

    .back:hover {
      color: #fff;
    }

    main {
      width: min(1120px, calc(100vw - 40px));
      margin: 0 auto;
      padding: 28px 0 44px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 22px;
    }

    .panel {
      border: 1px solid rgba(255, 255, 255, .10);
      border-radius: 10px;
      background: rgba(255, 255, 255, .045);
    }

    .metric {
      padding: 18px;
    }

    .metric span {
      display: block;
      color: rgba(229, 231, 235, .58);
      font-size: 12px;
    }

    .metric strong {
      display: block;
      margin-top: 8px;
      color: #fff;
      font-size: 30px;
      line-height: 1;
    }

    .section {
      margin-top: 14px;
      padding: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      line-height: 1.2;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 16px;
      line-height: 1.3;
    }

    .muted {
      margin: 0 0 22px;
      color: rgba(229, 231, 235, .62);
      font-size: 14px;
      line-height: 1.6;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      padding: 11px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, .08);
      text-align: left;
      vertical-align: top;
    }

    th {
      color: rgba(229, 231, 235, .58);
      font-weight: 500;
    }

    td {
      color: #f3f4f6;
    }

    code {
      padding: 2px 5px;
      border-radius: 5px;
      background: rgba(255, 255, 255, .08);
      color: #dbeafe;
      font-family: Consolas, "SFMono-Regular", Menlo, Monaco, monospace;
      font-size: 12px;
    }

    .loading {
      color: rgba(229, 231, 235, .62);
    }

    @media (max-width: 820px) {
      .summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      main {
        width: calc(100vw - 24px);
      }

      .summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
<script src="assets/spaceman-pages-adapter.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">SPACEMAN</div>
    <a class="back" href="">返回主页面</a>
  </header>
  <main>
    <h1>SPACEMAN 星座状态</h1>
    <p class="muted">当前页面读取本地状态接口，展示正在被三维可视化和智能助手使用的卫星星座配置。</p>

    <div class="summary">
      <div class="panel metric"><span>卫星总数</span><strong id="sat-count">--</strong></div>
      <div class="panel metric"><span>活跃卫星</span><strong id="active-count">--</strong></div>
      <div class="panel metric"><span>壳层数量</span><strong id="shell-count">--</strong></div>
      <div class="panel metric"><span>TLE 行数</span><strong id="tle-lines">--</strong></div>
    </div>

    <section class="panel section">
      <h2>轨道壳层</h2>
      <table>
        <thead>
          <tr>
            <th>层级</th>
            <th>Walker / 架构</th>
            <th>数量</th>
            <th>轨道面</th>
            <th>相位</th>
            <th>高度</th>
            <th>倾角</th>
          </tr>
        </thead>
        <tbody id="layers">
          <tr><td class="loading" colspan="7">加载中...</td></tr>
        </tbody>
      </table>
    </section>

    <section class="panel section">
      <h2>数据源</h2>
      <table>
        <tbody id="sources">
          <tr><td class="loading">加载中...</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <script>
    const fmt = new Intl.NumberFormat("zh-CN");

    function setText(id, value) {
      const el = document.getElementById(id);
      if (el) el.textContent = value;
    }

    function cell(value) {
      return `<td>${value == null ? "--" : String(value)}</td>`;
    }

    fetch("/local-api/spaceman-status", { cache: "no-store" })
      .then((res) => res.json())
      .then((payload) => {
        const status = payload.data || {};
        const constellation = status.constellation || {};
        const layers = Array.isArray(constellation.layers) ? constellation.layers : [];
        const source = status.dataSource || {};

        setText("sat-count", fmt.format(constellation.totalSatellites || 0));
        setText("active-count", fmt.format(constellation.activeSatellites || 0));
        setText("shell-count", fmt.format(constellation.shellCount || layers.length));
        setText("tle-lines", fmt.format(status.tleLineCount || 0));

        document.getElementById("layers").innerHTML = layers.map((layer) => `
          <tr>
            ${cell(layer.name)}
            ${cell(`<code>${layer.walker}</code>`)}
            ${cell(fmt.format(layer.total || 0))}
            ${cell(layer.planes)}
            ${cell(layer.phasing)}
            ${cell(`${layer.altitudeKm} km`)}
            ${cell(`${layer.inclinationDeg} deg`)}
          </tr>
        `).join("");

        document.getElementById("sources").innerHTML = [
          ["卫星元数据", source.metadataFile],
          ["TLE 数据", source.tleFile],
          ["生成脚本", source.generator],
          ["数据类型", source.synthetic ? "本地合成星座" : "外部数据"],
          ["历元", source.epoch]
        ].map(([key, value]) => `<tr><th>${key}</th><td><code>${value || "--"}</code></td></tr>`).join("");
      })
      .catch((error) => {
        document.getElementById("layers").innerHTML = `<tr><td colspan="7">状态加载失败：${error.message || error}</td></tr>`;
      });
  </script>
</body>
</html>
